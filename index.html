<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Namoz Reminder</title>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="mark">☾</span><div><b>Namoz Reminder</b><small>Shaxsiy namoz taqvimi</small></div></div>
      <button id="refresh" class="icon-btn" aria-label="Yangilash">↻</button>
    </header>
    <section class="hero">
      <p class="eyebrow">NAMANGAN · BUGUN</p>
      <h1 id="today">—</h1>
      <p id="date" class="muted">Namoz vaqtlari yuklanmoqda...</p>
      <div class="next-card">
        <span class="muted">Keyingi namoz</span>
        <strong id="nextName">—</strong>
        <div id="countdown" class="countdown">--:--:--</div>
        <small id="nextAt" class="muted">—</small>
      </div>
    </section>
    <section class="times">
      <div class="section-title"><h2>Bugungi vaqtlar</h2><span id="status">Yuklanmoqda</span></div>
      <div id="prayers" class="prayer-list"></div>
    </section>
    <section class="settings">
      <h2>Eslatma sozlamalari</h2>
      <label class="switch-row"><span><b>Bildirishnomalar</b><small>Namozdan oldin eslatma olish</small></span><input id="notifications" type="checkbox"></label>
      <label class="field"><span>Necha daqiqa oldin?</span>
        <select id="lead"><option value="5">5 daqiqa</option><option value="10" selected>10 daqiqa</option><option value="15">15 daqiqa</option><option value="20">20 daqiqa</option></select>
      </label>
      <p class="hint" id="notice">Bildirishnomalarni yoqish uchun tugmani bosing.</p>
    </section>
    <footer>Namangan, O‘zbekiston <span id="updated"></span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
